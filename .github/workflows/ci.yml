name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "develop/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Detect optional E2E suite
        id: e2e
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['test:e2e'] ? 0 : 1)"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browser
        if: steps.e2e.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        if: steps.e2e.outputs.enabled == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure() && steps.e2e.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
